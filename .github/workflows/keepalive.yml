name: Keep alive (Render + Supabase)

# Render (plan gratis) da 750 horas/mes. Mantenerlo despierto 24/7 las agota
# y Render suspende el servicio. Por eso pingueamos SOLO en horario laboral
# (6 AM–9 PM Perú = 11:00–02:00 UTC), así queda rápido cuando se trabaja,
# duerme de noche, y NO supera las 750 horas gratis.
# IMPORTANTE: para que esto sirva, NO debe haber otro pinger 24/7 (UptimeRobot).
on:
  schedule:
    - cron: '*/10 0-2,11-23 * * *'   # cada 10 min, solo 06:00–21:00 hora Perú
  workflow_dispatch:

# Evita que se acumulen ejecuciones si una tarda
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend (despierta Render + toca la BD)
        run: |
          ok=0
          # Varios intentos por corrida para cubrir el arranque en frío de Render
          for i in 1 2 3 4 5 6; do
            echo "Intento $i..."
            RESP=$(curl -s -m 120 https://tireinspect-api.onrender.com/health || true)
            echo "Respuesta: $RESP"
            if echo "$RESP" | grep -q '"db": *"up"'; then
              echo "OK: backend y base de datos activos"
              ok=1
              break
            fi
            sleep 20
          done
          if [ "$ok" != "1" ]; then
            echo "Aviso: no se confirmó activo (Render puede estar despertando)."
          fi
