name: Keep alive (Render + Supabase)

# Render (plan gratis) apaga el servicio tras ~15 min sin tráfico.
# Supabase (plan gratis) pausa el proyecto tras 7 días sin actividad.
# Este workflow pinguea /health cada 10 min: mantiene Render despierto
# y, al tocar la BD (SELECT 1), también mantiene activo Supabase.
on:
  schedule:
    - cron: '*/10 * * * *'   # cada 10 minutos (GitHub puede retrasarlo unos min)
  workflow_dispatch:

# Evita que se acumulen ejecuciones si una tarda
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend (despierta Render + toca la BD)
        run: |
          ok=0
          # Varios intentos por corrida para cubrir el arranque en frío de Render
          for i in 1 2 3 4 5 6; do
            echo "Intento $i..."
            RESP=$(curl -s -m 120 https://tireinspect-api.onrender.com/health || true)
            echo "Respuesta: $RESP"
            if echo "$RESP" | grep -q '"db": *"up"'; then
              echo "OK: backend y base de datos activos"
              ok=1
              break
            fi
            sleep 20
          done
          if [ "$ok" != "1" ]; then
            echo "Aviso: no se confirmó activo (Render puede estar despertando)."
          fi
